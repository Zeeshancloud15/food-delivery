apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-app
  template:
    metadata:
      labels:
        app: food-app
    spec:
      containers:
      - name: food-app
        image: zeeshancloud15/food-app:latest
        ports:
        - containerPort: 8080
