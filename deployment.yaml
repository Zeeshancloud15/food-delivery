apiVersion: apps/v1
kind: Deployment

metadata:
  name: TECH-app

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: TECH-app

  template:
    metadata:
      labels:
        app: TECH-app

    spec:
      containers:
        - name: TECH-app

          image: zeeshancloud15/TECH-app:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080
