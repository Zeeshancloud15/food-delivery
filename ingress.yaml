apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: zeesha.agency
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: food-service
            port:
              number: 80
